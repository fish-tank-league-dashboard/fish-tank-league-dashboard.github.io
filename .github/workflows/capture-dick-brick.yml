name: Capture Dick Brick

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-dick-brick.yml
      - scripts/capture-dick-brick.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: verify ESPN access, preliminary Monday-morning projections, capture before MNF, finalize a captured week, or auto (both)
        type: choice
        options: [verify, preliminary, wait, auto, capture, finalize, review]
        default: verify
  schedule:
    # Pre-MNF capture. GitHub drops scheduled runs or starts them hours late (Week 3's
    # arrived four hours late, after kickoff), so a start is requested every hour from
    # 6am EDT / 5am EST on Monday. Whichever run starts first sleeps until ~20 minutes
    # before kickoff; one that starts more than ~5 hours early hands off to a fresh run
    # because a job can only live six hours. Later runs see the capture and exit.
    # Do not thin these out.
    - cron: '0 10-23 * * 1'
    # Late arrivals and the EST window (kickoff is 01:15 UTC after DST ends).
    - cron: '*/15 0-1 * * 2'
    # Preliminary win probabilities from 10am Eastern on Monday. Cron is UTC with no DST:
    # 14:00 UTC is 10am EDT and 15:00 UTC is 10am EST. The script records the first time
    # it gets to run after 10am Eastern and skips once the week has a preview.
    - cron: '0 14,15 * * 1'
    # Finalize once ESPN has processed Monday's results: hourly 7am-3pm EDT Tuesday (6am-2pm EST),
    # because GitHub can start any single run hours late, then once Wednesday morning as a backup.
    # Finalize is idempotent: a finalized week is skipped.
    - cron: '0 11-19 * * 2'
    - cron: '0 11 * * 3'

permissions:
  contents: write
  pages: write
  # Lets a wait run start its own replacement.
  actions: write

# A wait run holds the capture group for hours, so quick runs (preliminary, verify,
# finalize, review, code pushes) use their own group instead of queueing behind it.
concurrency:
  group: dick-brick-${{ (github.event_name == 'push' || github.event.schedule == '0 14,15 * * 1' || github.event.schedule == '0 11-19 * * 2' || github.event.schedule == '0 11 * * 3' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'wait' && inputs.mode != 'capture' && inputs.mode != 'auto')) && 'quick' || 'capture' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # A wait run can sleep for hours; GitHub's hard limit is 360 minutes.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture or finalize the weekly record
        env:
          ESPN_LEAGUE_ID: '791101930'
          ESPN_SEASON: '2026'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # A change to the capture code checks ESPN access and refreshes the Week 1 retrospective.
            node scripts/capture-dick-brick.mjs review 1
            node scripts/capture-dick-brick.mjs verify
            exit 0
          fi
          if [ "$mode" = "review" ]; then node scripts/capture-dick-brick.mjs review 1; exit 0; fi
          if [ -z "$mode" ]; then
            if [ "${{ github.event.schedule }}" = "0 14,15 * * 1" ]; then node scripts/capture-dick-brick.mjs preliminary --scheduled; exit 0; fi
            case "${{ github.event.schedule }}" in '0 11-19 * * 2'|'0 11 * * 3') mode=finalize ;; *) mode=wait ;; esac
          fi
          node scripts/capture-dick-brick.mjs "$mode"
      - name: Commit captured records
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/dick-bricks.json data/dick-brick-snapshots.json data/dick-brick-preliminary.json && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "No Dick Brick changes."
            exit 0
          fi
          git config user.name "fish-tank-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dick-bricks.json data/dick-brick*.json
          git commit -m "data: capture Dick Brick record"
          git pull --rebase
          git push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
