name: Capture Dick Brick

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-dick-brick.yml
      - scripts/capture-dick-brick.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: verify ESPN access, preliminary Monday midday projections, capture before MNF, finalize a captured week, or auto (both)
        type: choice
        options: [verify, preliminary, wait, auto, capture, finalize, finalize-wait, review]
        default: verify
  schedule:
    # Pre-MNF capture. GitHub drops scheduled runs or starts them hours late (Week 3's
    # arrived four hours late, after kickoff), so a start is requested every hour from
    # 6am EDT / 5am EST on Monday. Whichever run starts first sleeps until ~20 minutes
    # before kickoff; one that starts more than ~5 hours early hands off to a fresh run
    # because a job can only live six hours. Later runs see the capture and exit.
    # Do not thin these out.
    - cron: '0 10-23 * * 1'
    # Late arrivals and the EST window (kickoff is 01:15 UTC after DST ends).
    - cron: '*/15 0-1 * * 2'
    # Start at 11:30am Eastern to leave time for delayed GitHub starts and retries before
    # the 1:00pm league readout. Cron is UTC and ignores DST, so each slot is listed for
    # both offsets. The script checks Eastern time and the current week's preview before
    # writing. Keep the 12:30/12:45 slots and hourly Monday runs as fallbacks.
    # Do not collapse these into one slot.
    - cron: '30 15-17 * * 1'
    - cron: '45 15-17 * * 1'
    # Earlier non-zero-minute anchors can wait for 11:30 ET if hourly starts lag.
    - cron: '17 12,13,14 * * 1'
    # Finalize once ESPN has processed Monday's results: hourly 7am-3pm EDT Tuesday (6am-2pm EST),
    # because GitHub can start any single run hours late, then once Wednesday morning as a backup.
    # Finalize is idempotent: a finalized week is skipped. These are now only a backup: any
    # run that leaves a captured week unfinalized starts a finalize-wait run (see the last step).
    - cron: '0 11-19 * * 2'
    - cron: '0 11 * * 3'

permissions:
  contents: write
  pages: write
  # Lets a wait run start its own replacement.
  actions: write

jobs:
  preliminary:
    # Every Monday hourly run is another chance to publish before Brick Watch.
    # Job-level concurrency keeps this separate from the long pre-MNF wait.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'preliminary') || github.event.schedule == '0 10-23 * * 1' || github.event.schedule == '17 12,13,14 * * 1' || github.event.schedule == '30 15-17 * * 1' || github.event.schedule == '45 15-17 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: dick-brick-preliminary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record current-week preliminary projections
        env:
          ESPN_LEAGUE_ID: '791101930'
          ESPN_SEASON: '2026'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # An early runner stays alive until 11:30 ET. TZ handles EDT/EST.
            et_hour=$(TZ=America/New_York date +%H)
            et_minute=$(TZ=America/New_York date +%M)
            et_second=$(TZ=America/New_York date +%S)
            if [ "$et_hour" -lt 8 ]; then
              echo "Before 8am ET; a later Monday run will handle the preview."
              exit 0
            fi
            wait_seconds=$(( (11 * 60 + 30 - 10#$et_hour * 60 - 10#$et_minute) * 60 - 10#$et_second ))
            if [ "$wait_seconds" -gt 0 ]; then
              echo "Waiting $wait_seconds seconds until 11:30am ET."
              sleep "$wait_seconds"
            fi
            # Retry ESPN errors or an incomplete snapshot while there is still time for
            # the 1pm readout. The check confirms current week, timestamp, and 5 games.
            for attempt in $(seq 1 18); do
              if node scripts/capture-dick-brick.mjs preliminary --scheduled && node scripts/capture-dick-brick.mjs preliminary-check; then
                exit 0
              fi
              et_time=$(TZ=America/New_York date +%H%M)
              if [ "$((10#$et_time))" -ge 1255 ] || [ "$attempt" -eq 18 ]; then
                echo "No fresh preliminary snapshot after $attempt attempt(s)."
                exit 1
              fi
              echo "Preliminary capture is missing or incomplete; retrying in 5 minutes."
              sleep 300
            done
          else
            node scripts/capture-dick-brick.mjs preliminary
            node scripts/capture-dick-brick.mjs preliminary-check
          fi
      - name: Publish preliminary snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/dick-brick-preliminary.json; then
            echo "No preliminary changes."
            exit 0
          fi
          git config user.name "fish-tank-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dick-brick-preliminary.json
          git commit -m "data: refresh Dick Brick preliminary"
          git pull --rebase
          git push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  capture:
    # Preliminary runs have their own job so a long wait cannot hold up the preview.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'preliminary') && github.event.schedule != '17 12,13,14 * * 1' && github.event.schedule != '30 15-17 * * 1' && github.event.schedule != '45 15-17 * * 1' }}
    runs-on: ubuntu-latest
    concurrency:
      group: dick-brick-${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'finalize-wait') && 'finalize' || ((github.event_name == 'push' || github.event.schedule == '0 11-19 * * 2' || github.event.schedule == '0 11 * * 3' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'wait' && inputs.mode != 'capture' && inputs.mode != 'auto')) && 'quick' || 'capture') }}
      cancel-in-progress: false
    # A wait run can sleep for hours; GitHub's hard limit is 360 minutes.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture or finalize the weekly record
        env:
          ESPN_LEAGUE_ID: '791101930'
          ESPN_SEASON: '2026'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Workflow or capture-code changes check current ESPN access.
            node scripts/capture-dick-brick.mjs verify
            exit 0
          fi
          if [ "$mode" = "review" ]; then node scripts/capture-dick-brick.mjs review 1; exit 0; fi
          if [ -z "$mode" ]; then
            case "${{ github.event.schedule }}" in '0 11-19 * * 2'|'0 11 * * 3') mode=finalize ;; *) mode=wait ;; esac
          fi
          node scripts/capture-dick-brick.mjs "$mode"
      - name: Commit captured records
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/dick-bricks.json data/dick-brick-snapshots.json data/dick-brick-preliminary.json && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "No Dick Brick changes."
            exit 0
          fi
          git config user.name "fish-tank-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dick-bricks.json data/dick-brick*.json
          git commit -m "data: capture Dick Brick record"
          git pull --rebase
          git push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Keep finalizing until ESPN posts final scores
        if: success() && inputs.mode != 'finalize-wait'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node scripts/capture-dick-brick.mjs finalize-pending)" = "yes" ]; then
            gh workflow run capture-dick-brick.yml --ref main -f mode=finalize-wait
            echo "Started a finalize-wait run."
          fi
