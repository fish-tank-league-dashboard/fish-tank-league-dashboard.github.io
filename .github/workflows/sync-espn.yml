name: Refresh ESPN league data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * 2,5"

permissions:
  contents: write

concurrency:
  group: espn-league-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh 2026 ESPN snapshot
        env:
          ESPN_LEAGUE_ID: "791101930"
          ESPN_SEASON: "2026"
          ESPN_OUTPUT: "data/espn-2026.json"
        run: node scripts/sync-espn.mjs

      - name: Publish changes
        run: |
          if git diff --quiet -- data/espn-2026.json; then
            echo "No league changes."
            exit 0
          fi
          git config user.name "fish-tank-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/espn-2026.json
          git commit -m "data: refresh ESPN 2026 league"
          git push
