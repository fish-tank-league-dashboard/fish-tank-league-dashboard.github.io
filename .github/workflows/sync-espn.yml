name: Refresh ESPN league data

on:
  workflow_dispatch:
  # GitHub cron is always UTC and ignores DST. Days are the UTC day, so
  # Thursday night ET is Friday UTC (5) and Monday night ET is Tuesday UTC (2).
  # Evening windows run through hour 4 UTC on purpose: when EDT ends on
  # 2026-11-01 games shift an hour later in UTC, and the padding covers both.
  # The extra no-op runs cost nothing because unchanged data skips the commit
  # and the Pages build. Do not trim these hours.
  schedule:
    # Sunday main slate through SNF (most games, most score movement)
    - cron: "0,30 17-23 * * 0"
    # Sunday late games and SNF finish (spills past midnight UTC)
    - cron: "0,30 0-4 * * 1"
    # Thursday Night Football, single game, hourly is enough
    - cron: "0 0-4 * * 5"
    # Monday Night Football, single game, hourly is enough
    - cron: "0 0-4 * * 2"
    # Post-MNF settle and midweek waivers/transactions (existing cadence)
    - cron: "30 10 * * 2,4"

permissions:
  contents: write
  pages: write

concurrency:
  group: espn-league-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh 2026 ESPN snapshot
        env:
          ESPN_LEAGUE_ID: "791101930"
          ESPN_SEASON: "2026"
          ESPN_OUTPUT: "data/espn-2026.json"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/sync-espn.mjs

      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/espn-2026.json; then
            echo "No league changes."
            exit 0
          fi
          git config user.name "fish-tank-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/espn-2026.json
          git commit -m "data: refresh ESPN 2026 league"
          git push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
